name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Read package version
        id: metadata
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag does not match package version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=release/auto-update/Codex-Navo-Setup-$version-windows-x64.exe" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: npm run build:desktop

      - name: Verify and summarize installer
        shell: pwsh
        run: |
          $installer = '${{ steps.metadata.outputs.installer }}'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Windows installer was not produced: $installer"
          }
          $file = Get-Item -LiteralPath $installer
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          @(
            '## Windows release artifact'
            ''
            "- File: ``$($file.Name)``"
            "- Size: $($file.Length) bytes"
            "- SHA-256: ``$hash``"
            "- Authenticode: ``$($signature.Status)`` (code signing is currently disabled)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Validate automatic update artifacts
        run: node scripts/verify-update-artifacts.js

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Codex-Navo-Setup-${{ steps.metadata.outputs.version }}-windows-x64.exe
          path: ${{ steps.metadata.outputs.installer }}
          archive: false
          if-no-files-found: error

      - name: Upload complete automatic update bundle
        uses: actions/upload-artifact@v7
        with:
          name: Codex-Navo-auto-update-${{ steps.metadata.outputs.version }}
          path: |
            ${{ steps.metadata.outputs.installer }}
            ${{ steps.metadata.outputs.installer }}.blockmap
            release/auto-update/latest.yml
          if-no-files-found: error
