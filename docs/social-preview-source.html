<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      align-items: center;
      gap: 62px;
      padding: 76px 86px;
      color: #111827;
      background:
        radial-gradient(circle at 10% 6%, rgba(74, 122, 255, .22), transparent 36%),
        radial-gradient(circle at 95% 14%, rgba(30, 175, 194, .18), transparent 36%),
        linear-gradient(145deg, #f8faff, #f0f5fc);
      font-family: Inter, "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    body::after { content: ""; position: absolute; inset: 24px; border: 1px solid rgba(86, 108, 145, .12); border-radius: 32px; pointer-events: none; }
    .left { position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 17px; margin-bottom: 30px; font-size: 24px; font-weight: 760; }
    .brand img { width: 64px; height: 64px; border-radius: 16px; filter: drop-shadow(0 14px 24px rgba(34, 75, 150, .22)); }
    h1 { margin: 0; font-size: 62px; line-height: 1.04; letter-spacing: -.045em; }
    h1 span { color: transparent; background: linear-gradient(110deg, #2768e6, #7458dc 60%, #1ba4b8); background-clip: text; }
    .tagline { max-width: 620px; margin: 25px 0 0; color: #475467; font-size: 22px; line-height: 1.5; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .chip { padding: 9px 13px; border: 1px solid rgba(39, 104, 230, .16); border-radius: 999px; background: rgba(255,255,255,.72); color: #344054; font-size: 14px; font-weight: 650; }
    .visual { position: relative; height: 430px; }
    .panel { position: absolute; border: 1px solid rgba(255,255,255,.9); border-radius: 24px; background: rgba(255,255,255,.8); box-shadow: 0 28px 72px rgba(34, 57, 96, .17); backdrop-filter: blur(14px); }
    .panel.main { inset: 24px 0 24px 34px; padding: 28px; transform: rotate(1.5deg); }
    .window { height: 100%; overflow: hidden; border: 1px solid #e3e8f0; border-radius: 16px; background: #fff; }
    .window-top { display: flex; align-items: center; gap: 7px; height: 42px; padding: 0 15px; border-bottom: 1px solid #edf0f5; background: #fafbfc; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d7dde6; }
    .window-body { display: grid; grid-template-columns: 108px 1fr; height: calc(100% - 42px); }
    .side { padding: 20px 13px; background: #f7f9fc; }
    .side-line { height: 10px; margin-bottom: 16px; border-radius: 5px; background: #dfe5ef; }
    .side-line.active { background: #6c8fe4; }
    .content { padding: 22px; }
    .title { width: 48%; height: 13px; margin-bottom: 18px; border-radius: 6px; background: #26364f; }
    .account { margin-bottom: 14px; padding: 16px; border: 1px solid #e5e9f0; border-radius: 13px; box-shadow: 0 5px 15px rgba(28, 48, 86, .05); }
    .row { display: flex; justify-content: space-between; }
    .name { width: 42%; height: 11px; border-radius: 6px; background: #6b7c96; }
    .value { width: 18%; height: 11px; border-radius: 6px; background: #b3bdcc; }
    .bar { height: 7px; margin-top: 15px; overflow: hidden; border-radius: 5px; background: #edf1f6; }
    .bar::before { content: ""; display: block; width: 74%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #3977eb, #6c5ddf); }
    .float { right: -18px; bottom: 4px; width: 220px; padding: 18px; transform: rotate(-2deg); }
    .float-title { margin-bottom: 12px; font-size: 13px; font-weight: 760; }
    .metric { display: flex; justify-content: space-between; margin-top: 8px; color: #5d6778; font-size: 11px; }
    .opensource { position: absolute; right: 84px; bottom: 48px; color: #667085; font-size: 14px; font-weight: 650; letter-spacing: .08em; }
  </style>
</head>
<body>
  <section class="left">
    <div class="brand"><img src="../desktop-src/icon.png" alt=""><span>CODEX NAVO</span></div>
    <h1>Codex Multi-Account<br><span>Workspace</span></h1>
    <p class="tagline">Account isolation · Quota & token tracking · OpenAI-compatible API pool · Automatic failover · Per-account proxies</p>
    <div class="chips"><span class="chip">Windows</span><span class="chip">Local-first</span><span class="chip">Open Source</span></div>
  </section>
  <section class="visual">
    <div class="panel main">
      <div class="window">
        <div class="window-top"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <div class="window-body">
          <div class="side"><div class="side-line active"></div><div class="side-line"></div><div class="side-line"></div><div class="side-line"></div></div>
          <div class="content"><div class="title"></div><div class="account"><div class="row"><span class="name"></span><span class="value"></span></div><div class="bar"></div></div><div class="account"><div class="row"><span class="name"></span><span class="value"></span></div><div class="bar"></div></div><div class="account"><div class="row"><span class="name"></span><span class="value"></span></div><div class="bar"></div></div></div>
        </div>
      </div>
    </div>
    <div class="panel float"><div class="float-title">Current task · 68%</div><div class="bar"></div><div class="metric"><span>Input</span><strong>94.5K</strong></div><div class="metric"><span>Cache rate</span><strong>95%</strong></div><div class="metric"><span>Output</span><strong>8.2K</strong></div></div>
  </section>
  <div class="opensource">GITHUB.COM/1080SSF/CODEX-NAVO</div>
</body>
</html>
